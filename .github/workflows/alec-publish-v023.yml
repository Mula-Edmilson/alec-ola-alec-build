name: ALEC Publish validated 0.2.3
on:
  push:
    branches: [alec-signed-updater]
    paths: ['.github/workflows/alec-publish-v023.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: alec-publish-v023
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Mula-Edmilson/alec-ola-alec-build'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      EXPECTED_SHA: 2e4299643a2027545df3a8c9f4451d81ddd1b306
      RUN_ID: '45889789919'
      TAG: v0.2.3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify publication-only commit and wait for exact signed candidate and validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SHA"
          test "$(git diff --name-only "$EXPECTED_SHA" HEAD)" = ".github/workflows/alec-publish-v023.yml"
          build="$(gh run view "$RUN_ID" --json status,conclusion,headSha,headBranch,workflowName --repo "$GITHUB_REPOSITORY")"
          jq -e --arg sha "$EXPECTED_SHA" '.status=="completed" and .conclusion=="success" and .headSha==$sha and .headBranch=="alec-signed-updater" and .workflowName=="ALEC Desktop Windows candidate"' <<<"$build"
          validation="$(gh run view 45889789933 --json status,conclusion,headSha,headBranch,workflowName --repo "$GITHUB_REPOSITORY")"
          jq -e --arg sha "$EXPECTED_SHA" '.status=="completed" and .conclusion=="success" and .headSha==$sha and .headBranch=="alec-signed-updater" and .workflowName=="ALEC Signed Updater validation"' <<<"$validation"
      - name: Verify exact signed package and mandatory runtime navigation report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" | jq -e --arg sha "$EXPECTED_SHA" '[.artifacts[] | select(.expired==false and .name=="ALEC-Desktop-Preview-Windows-x64-candidate" and .workflow_run.head_sha==$sha)] | length==1'
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ALEC-Desktop-Preview-Windows-x64-candidate --dir candidate
          node desktop-redesign/native/verify-alec-release.mjs candidate
          test "$(tail -n 1 candidate/SOURCE.txt | tr -d '\r')" = "$EXPECTED_SHA"
          jq -e '.navigationVerified==true and .revision=="ALEC_ORB_NATIVE_V6" and .visible==true and .tabs==8' candidate/ALEC-native-visual-report.json
          test -s candidate/LICENSE
          test -s candidate/ALEC-source.patch
          test -d candidate/new-source
          (cd candidate && zip -qr ALEC-corresponding-source.zip ALEC-source.patch new-source LICENSE SOURCE.txt BUILD-CANDIDATE.md)
      - name: Publish the single-channel 0.2.3 update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/alec-signed-updater" --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Release already exists; refusing replacement'; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then echo 'Tag already exists; refusing replacement'; exit 1; fi
          cat > notes.md <<'EOF'
          ## ALEC 0.2.3
          - Actualização assinada directamente pelo botão superior: um clique para verificar e instalar, sem alerta do navegador.
          - Confirmações de operações sensíveis integradas no design do painel ALEC.
          - Arranque do Orb: handshake repetido até confirmação e animação de materialização no início da sessão.
          - Validações automatizadas e compilação Windows, incluindo teste de arranque e navegação no runtime instalado, concluídas com sucesso.
          - Canal único de actualizações. O nome do instalador mantém Preview por compatibilidade com o manifesto.
          **Limitações:** a experiência de actualização entre versões e a animação visual ainda requerem confirmação num PC real. Rollback automático não implementado. A autenticação DPAPI do Sigma e Universal AI permanecem pendentes. A assinatura Tauri não equivale a Authenticode. Guarda uma cópia de segurança.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$EXPECTED_SHA" --title "ALEC 0.2.3" --notes-file notes.md --draft --latest=false \
            candidate/ALEC-Desktop-0.2.3-Preview-x64-setup.exe \
            candidate/ALEC-Desktop-0.2.3-Preview-x64-setup.exe.sig \
            candidate/latest.json candidate/SHA256.txt candidate/LICENSE candidate/ALEC-corresponding-source.zip
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=true
