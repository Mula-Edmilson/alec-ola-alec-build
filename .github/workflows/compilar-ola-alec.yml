name: "ALEC V5 - Hello Alex openWakeWord para Windows"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/compilar-ola-alec.yml"
      - "Instalar-ALEC-Compilado.ps1"
      - "Restaurar-ALEC.ps1"
      - "Diagnosticar-ALEC.ps1"
      - "scripts/patch-ola-alec.py"
      - "scripts/clap.rs"
      - "Palmada-Dupla-ALEC.ps1"
      - "Calibrar-Palmadas-ALEC.ps1"
      - "scripts/clap_learning.rs"
      - "scripts/patch-calibracao.py"
      - "scripts/neuralwake.rs"
      - "scripts/patch-openwakeword.py"
      - "Instalar-Modelo-Hello-Alex.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: "Compilar helper Windows x64"
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Obter projecto ALEC
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descarregar codigo oficial do Roamies v0.1.49
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.1.49 https://github.com/KenKaiii/Roamies.git upstream
          python - <<'PYVERSION'
          import json
          from pathlib import Path
          file = Path('upstream/showcase/tauri/src-tauri/tauri.conf.json')
          version = json.loads(file.read_text(encoding='utf-8'))['version']
          assert version == '0.1.49', f'Incompatibilidade: {version}'
          print('Versao verificada:', version)
          PYVERSION

      - name: Aplicar patch ALEC V3 (voz e dupla palmada)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch-ola-alec.py

      - name: Integrar treino de palmadas com três exemplos
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch-calibracao.py

      - name: Integrar motor neural Hello Alex opcional
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch-openwakeword.py

      - name: Configurar Rust MSVC no servidor
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          cargo --version

      - name: Testar reconhecimento
        shell: bash
        run: |
          set -euo pipefail
          cargo test --release --manifest-path upstream/showcase/tauri/src-tauri/voice-win/Cargo.toml --target x86_64-pc-windows-msvc wake::tests -- --nocapture
          cargo test --release --manifest-path upstream/showcase/tauri/src-tauri/voice-win/Cargo.toml --target x86_64-pc-windows-msvc clap::tests -- --nocapture
          cargo test --release --manifest-path upstream/showcase/tauri/src-tauri/voice-win/Cargo.toml --target x86_64-pc-windows-msvc clap_learning::tests -- --nocapture
          cargo test --release --manifest-path upstream/showcase/tauri/src-tauri/voice-win/Cargo.toml --target x86_64-pc-windows-msvc alec_palmada_dupla -- --nocapture
          cargo test --release --manifest-path upstream/showcase/tauri/src-tauri/voice-win/Cargo.toml --target x86_64-pc-windows-msvc alec_neural_wake -- --nocapture
          cargo test --release --manifest-path upstream/showcase/tauri/src-tauri/voice-win/Cargo.toml --target x86_64-pc-windows-msvc neuralwake::tests -- --nocapture

      - name: Compilar apenas roamies-voice.exe
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path upstream/showcase/tauri/src-tauri/voice-win/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Preparar executavel, versao e integridade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'upstream/showcase/tauri/src-tauri/voice-win/target/x86_64-pc-windows-msvc/release/roamies-voice.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw "Executavel nao encontrado: $exe" }
          New-Item -ItemType Directory -Path resultado -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination resultado/roamies-voice.exe
          '0.1.49' | Set-Content -Path resultado/ROAMIES_VERSION.txt -Encoding ascii
          (Get-FileHash -Path resultado/roamies-voice.exe -Algorithm SHA256).Hash | Set-Content -Path resultado/SHA256.txt -Encoding ascii
          if (Test-Path -LiteralPath 'Instalar-ALEC-Compilado.ps1') {
            Copy-Item -LiteralPath 'Instalar-ALEC-Compilado.ps1' -Destination resultado/Instalar-ALEC-Compilado.ps1
          }
          if (Test-Path -LiteralPath 'Restaurar-ALEC.ps1') {
            Copy-Item -LiteralPath 'Restaurar-ALEC.ps1' -Destination resultado/Restaurar-ALEC.ps1
          }
          if (Test-Path -LiteralPath 'Diagnosticar-ALEC.ps1') {
            Copy-Item -LiteralPath 'Diagnosticar-ALEC.ps1' -Destination resultado/Diagnosticar-ALEC.ps1
          }
          if (Test-Path -LiteralPath 'Palmada-Dupla-ALEC.ps1') {
            Copy-Item -LiteralPath 'Palmada-Dupla-ALEC.ps1' -Destination resultado/Palmada-Dupla-ALEC.ps1
          }
          if (Test-Path -LiteralPath 'Calibrar-Palmadas-ALEC.ps1') {
            Copy-Item -LiteralPath 'Calibrar-Palmadas-ALEC.ps1' -Destination resultado/Calibrar-Palmadas-ALEC.ps1
          }
          if (Test-Path -LiteralPath 'Instalar-Modelo-Hello-Alex.ps1') {
            Copy-Item -LiteralPath 'Instalar-Modelo-Hello-Alex.ps1' -Destination resultado/Instalar-Modelo-Hello-Alex.ps1
          }
          'ALEC V5: motor neural openWakeWord Hello Alex opcional. Palmadas desactivadas por defeito. Modelo treinado no Colab separadamente. Roamies 0.1.49 Windows x64.' | Set-Content -Path resultado/LEIA-ME.txt -Encoding utf8

      - name: Publicar ZIP do executavel
        uses: actions/upload-artifact@v4
        with:
          name: "ALEC-V5-Hello-Alex-Windows"
          path: resultado/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
