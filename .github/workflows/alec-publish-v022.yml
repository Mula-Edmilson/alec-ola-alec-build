name: ALEC Publish validated 0.2.2
on:
  push:
    branches: [alec-signed-updater]
    paths: ['.github/workflows/alec-publish-v022.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: alec-publish-v022
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Mula-Edmilson/alec-ola-alec-build'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      EXPECTED_SHA: 1e133f7d8346d07c63264f52475f09e03b516162
      RUN_ID: '45882621649'
      TAG: v0.2.2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify publication-only commit and wait for exact signed candidate and validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SHA"
          test "$(git diff --name-only "$EXPECTED_SHA" HEAD)" = ".github/workflows/alec-publish-v022.yml"
          for attempt in $(seq 1 540); do
            build="$(gh run view "$RUN_ID" --json status,conclusion,headSha,headBranch,workflowName --repo "$GITHUB_REPOSITORY")"
            jq -e --arg sha "$EXPECTED_SHA" '.headSha==$sha and .headBranch=="alec-signed-updater" and .workflowName=="ALEC Desktop Windows candidate"' <<<"$build"
            validation="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/alec-signed-update-validation.yml/runs?head_sha=$GITHUB_SHA&branch=alec-signed-updater" | jq -c '.workflow_runs[0] // {}')"
            if [ "$(jq -r .status <<<"$build")" = completed ] && [ "$(jq -r .conclusion <<<"$build")" != success ]; then echo 'Windows candidate failed; refusing release'; exit 1; fi
            if [ "$(jq -r .status <<<"$validation")" = completed ] && [ "$(jq -r .conclusion <<<"$validation")" != success ]; then echo 'Validation failed; refusing release'; exit 1; fi
            if [ "$(jq -r .conclusion <<<"$build")" = success ] && [ "$(jq -r .conclusion <<<"$validation")" = success ]; then exit 0; fi
            sleep 10
          done
          echo 'Required validations did not complete in time'; exit 1
      - name: Verify exact signed package and mandatory runtime navigation report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" | jq -e --arg sha "$EXPECTED_SHA" '[.artifacts[] | select(.expired==false and .name=="ALEC-Desktop-Preview-Windows-x64-candidate" and .workflow_run.head_sha==$sha)] | length==1'
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ALEC-Desktop-Preview-Windows-x64-candidate --dir candidate
          node desktop-redesign/native/verify-alec-release.mjs candidate
          test "$(tail -n 1 candidate/SOURCE.txt | tr -d '\r')" = "$EXPECTED_SHA"
          jq -e '.navigationVerified==true and .revision=="ALEC_ORB_NATIVE_V6" and .visible==true and .tabs==8' candidate/ALEC-native-visual-report.json
          test -s candidate/LICENSE
          test -s candidate/ALEC-source.patch
          test -d candidate/new-source
          (cd candidate && zip -qr ALEC-corresponding-source.zip ALEC-source.patch new-source LICENSE SOURCE.txt BUILD-CANDIDATE.md)
      - name: Publish the single-channel 0.2.2 update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/alec-signed-updater" --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Release already exists; refusing replacement'; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then echo 'Tag already exists; refusing replacement'; exit 1; fi
          cat > notes.md <<'EOF'
          ## ALEC 0.2.2
          - Actualizações unificadas: sem selecção Stable/Preview dentro do ALEC; verificação a cada 15 minutos.
          - Notificação de nova versão pela bolha de diálogo original, adiada enquanto o agente está ocupado.
          - Botão Voltar com histórico e posição de scroll; layout Sigma reorganizado.
          - Compilação assinada, regressões e teste de navegação e sobreposição de botões no WebView instalado aprovados.
          - O instalador mantém o nome de ficheiro Preview por compatibilidade com o manifesto assinado; esta release é visível no feed normal para permitir a migração de versões anteriores.
          **Limitações:** a actualização real entre versões e a recuperação ainda requerem validação num PC real. Rollback automático não implementado. A autenticação DPAPI do Sigma e Universal AI ficam para a fase seguinte. A assinatura Tauri não equivale a Authenticode. Guarda uma cópia de segurança.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$EXPECTED_SHA" --title "ALEC 0.2.2" --notes-file notes.md --draft --latest=false \
            candidate/ALEC-Desktop-0.2.2-Preview-x64-setup.exe \
            candidate/ALEC-Desktop-0.2.2-Preview-x64-setup.exe.sig \
            candidate/latest.json candidate/SHA256.txt candidate/LICENSE candidate/ALEC-corresponding-source.zip
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=true
