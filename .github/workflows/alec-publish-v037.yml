name: ALEC Publish validated 0.3.7
on:
  push:
    branches: [alec-signed-updater]
    paths: ['.github/workflows/alec-publish-v037.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: alec-publish-v037
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Mula-Edmilson/alec-ola-alec-build'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_SHA: 58281d2fd4bdc62e2416e843de58e9d38779803d
      TAG: v0.3.7
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify publication-only commit and wait for exact signed candidate and validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$EXPECTED_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          test "$(git diff --name-only "$EXPECTED_SHA" HEAD)" = "$(printf '%s\n' .github/workflows/alec-desktop-windows.yml .github/workflows/alec-publish-v036.yml .github/workflows/alec-publish-v037.yml desktop-redesign/native/alec-release-history.json desktop-redesign/native/alec-version.json)"
          # Exact same application commit already passed the complete candidate audit and installer smoke.
          functional="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/46025346230")"
          jq -e --arg sha "$EXPECTED_SHA" '.id==46025346230 and .status=="completed" and .conclusion=="success" and .head_sha==$sha and .head_branch=="alec-live-engine" and .path==".github/workflows/alec-desktop-windows.yml"' <<<"$functional"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/46025346230/jobs" | jq -e '[.jobs[] | select(.name=="visual-review" or .name=="build")] | length==2 and any(.name=="build" and .conclusion=="success") and any(.name=="visual-review" and .conclusion=="skipped")'
          # This publication-only commit also triggers signed updater validation. Require its success:
          # the prior validation may be cancelled by its own concurrency policy.
          deadline=$((SECONDS+6500))
          while true; do
            build="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&branch=alec-signed-updater&per_page=100" | jq -c '[.workflow_runs[] | select(.path==".github/workflows/alec-desktop-windows.yml" and .event=="push")] | sort_by(.id) | last // {}')"
            if [ "$(jq -r '.id // empty' <<<"$build")" = "" ]; then test "$SECONDS" -lt "$deadline"; sleep 20; continue; fi
            RUN_ID="$(jq -r .id <<<"$build")"
            jq '{id,name,path,status,conclusion,head_sha,head_branch}' <<<"$build"
            jq -e --arg sha "$GITHUB_SHA" --argjson id "$RUN_ID" '.id==$id and .head_sha==$sha and .head_branch=="alec-signed-updater" and .path==".github/workflows/alec-desktop-windows.yml"' <<<"$build"
            if jq -e '.status=="completed"' <<<"$build" >/dev/null; then
              jq -e '.conclusion=="success"' <<<"$build"
              break
            fi
            test "$SECONDS" -lt "$deadline"
            sleep 20
          done
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          while true; do
            validation="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&branch=alec-signed-updater&per_page=100" | jq -c '[.workflow_runs[] | select(.path==".github/workflows/alec-signed-update-validation.yml")] | sort_by(.id) | last // {}')"
            if jq -e '.status=="completed"' <<<"$validation" >/dev/null; then
              jq -e --arg sha "$GITHUB_SHA" '.conclusion=="success" and .head_sha==$sha and .head_branch=="alec-signed-updater"' <<<"$validation"
              break
            fi
            test "$SECONDS" -lt "$deadline"
            sleep 20
          done
      - name: Verify exact signed package and mandatory runtime navigation report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" | jq -e --arg sha "$GITHUB_SHA" '[.artifacts[] | select(.expired==false and .name=="ALEC-Desktop-Preview-Windows-x64-candidate" and .workflow_run.head_sha==$sha)] | length==1'
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ALEC-Desktop-Preview-Windows-x64-candidate --dir candidate
          test "$(node -p "require('./desktop-redesign/native/alec-version.json').version")" = "${TAG#v}"
          node desktop-redesign/native/verify-alec-release.mjs candidate
          jq -e --arg version "${TAG#v}" '.version==$version' candidate/latest.json
          test "$(tail -n 1 candidate/SOURCE.txt | tr -d '\r')"  = "$GITHUB_SHA"
          jq -e '.navigationVerified==true and .revision=="ALEC_ORB_EVOLUTION_V1" and .visible==true and .tabs==8 and .coreLit>=100 and .motionPixels>=50 and .voicePixels>=50' candidate/ALEC-native-visual-report.json
          # Signed build re-runs the same UI audit; require its full report, not just the job result.
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ALEC-panel-layout-evidence --dir visual-evidence
          jq -e '.failures==[] and (.results|length)==168 and all(.results[]; .outside==[] and .collisions==[] and .headerOutside==[] and .headerCollisions==[] and .paletteIssues==[] and .untranslated==[] and .reachable==true)' visual-evidence/layout-report.json
          test -s candidate/new-source/showcase/panel/alec-theme.css
          grep -q 'Skill Hub / Ligações' candidate/new-source/showcase/panel/alec-theme.css
          test -s candidate/LICENSE
          test -s candidate/ALEC-source.patch
          test -d candidate/new-source
          test -s candidate/new-source/showcase/tauri/sidecar/alec-adaptive-memory.mjs
          for module in alec-live-host alec-live-transport alec-live-assets; do test -s "candidate/new-source/showcase/tauri/sidecar/$module.mjs"; done
          test -s candidate/new-source/showcase/tauri/sidecar/alec-conversation.mjs
          test -s candidate/new-source/showcase/tauri/src-tauri/voice-win/src/alec_conversation.rs
          test -s candidate/new-source/showcase/tauri/sidecar/alec-proactive.mjs
          test -s candidate/new-source/showcase/tauri/sidecar/alec-universal.mjs
          for module in alec-native-agents alec-agent-plans alec-browser-adapter alec-developer-adapter; do test -s "candidate/new-source/showcase/tauri/sidecar/$module.mjs"; done
          test -s candidate/new-source/showcase/tauri/agent-runtime/package-lock.json
          test -s candidate/third-party-licenses/Playwright-LICENSE
          test -s candidate/third-party-licenses/Playwright-Core-LICENSE
          (cd candidate && zip -qr ALEC-corresponding-source.zip ALEC-source.patch new-source LICENSE SOURCE.txt BUILD-CANDIDATE.md third-party-licenses)
      - name: Publish the single-channel 0.3.7 update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/alec-signed-updater" --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Release already exists; refusing replacement'; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then echo 'Tag already exists; refusing replacement'; exit 1; fi
          cat > notes.md <<'EOF'
          ## ALEC 0.3.7 — Hybrid Live (experimental)
          - Definições > Escuta > ALEC Live > Abrir Live. Inicia a sessão na janela do navegador padrão.
          - Utiliza a chave Gemini configurada em Contas ou Voz; áudio enviado ao Google apenas durante a sessão autorizada. O serviço pode cobrar pelo uso; o modelo Preview depende da conta.
          - Áudio bidireccional, transcrição em tempo real, supressão de eco solicitada ao navegador e interrupção quando o servidor indica barge-in.
          - Suspende o reconhecimento local durante Live e repõe o estado configurado ao terminar. Uma sessão, até 10 minutos, sem fallback automático.
          - Mantém as funcionalidades da 0.3.6; o modo Live ainda não chama ferramentas, não integra a Orb nativa e não grava a transcrição no histórico.
          **Limitações:** testes de protocolo e instalação não demonstram fluidez acústica real; recomenda-se testar no computador físico. Servidores locais externos e agentes já em execução não são automaticamente descarregados. A assinatura de actualização Tauri não equivale a Authenticode. A captura CDP adicional pode estar indisponível; a validação visual nativa é obrigatória.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ALEC 0.3.7" --notes-file notes.md --draft --latest=false \
            candidate/ALEC-Desktop-0.3.7-Preview-x64-setup.exe \
            candidate/ALEC-Desktop-0.3.7-Preview-x64-setup.exe.sig \
            candidate/latest.json candidate/SHA256.txt candidate/LICENSE candidate/ALEC-corresponding-source.zip
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=true
