name: ALEC Publish validated 0.3.2
on:
  push:
    branches: [alec-signed-updater]
    paths: ['.github/workflows/alec-publish-v032.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: alec-publish-v032
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Mula-Edmilson/alec-ola-alec-build'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      EXPECTED_SHA: 0b36f9d7b38ea5f316a6c72ca05a934b6e0f9e44
      RUN_ID: '45956939048'
      TAG: v0.3.2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify publication-only commit and wait for exact signed candidate and validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SHA"
          test "$(git diff --name-only "$EXPECTED_SHA" HEAD)" = ".github/workflows/alec-publish-v032.yml"
          build="$(gh run view "$RUN_ID" --json status,conclusion,headSha,headBranch,workflowName --repo "$GITHUB_REPOSITORY")"
          jq -e --arg sha "$EXPECTED_SHA" '.status=="completed" and .conclusion=="success" and .headSha==$sha and .headBranch=="alec-signed-updater" and .workflowName=="ALEC Desktop Windows candidate"' <<<"$build"
          validation="$(gh run view 45956939233 --json status,conclusion,headSha,headBranch,workflowName --repo "$GITHUB_REPOSITORY")"
          jq -e --arg sha "$EXPECTED_SHA" '.status=="completed" and .conclusion=="success" and .headSha==$sha and .headBranch=="alec-signed-updater" and .workflowName=="ALEC Signed Updater validation"' <<<"$validation"
      - name: Verify exact signed package and mandatory runtime navigation report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" | jq -e --arg sha "$EXPECTED_SHA" '[.artifacts[] | select(.expired==false and .name=="ALEC-Desktop-Preview-Windows-x64-candidate" and .workflow_run.head_sha==$sha)] | length==1'
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ALEC-Desktop-Preview-Windows-x64-candidate --dir candidate
          test "$(node -p "require('./desktop-redesign/native/alec-version.json').version")" = "${TAG#v}"
          node desktop-redesign/native/verify-alec-release.mjs candidate
          jq -e --arg version "${TAG#v}" '.version==$version' candidate/latest.json
          test "$(tail -n 1 candidate/SOURCE.txt | tr -d '\r')" = "$EXPECTED_SHA"
          jq -e '.navigationVerified==true and .revision=="ALEC_ORB_EVOLUTION_V1" and .visible==true and .tabs==8 and .coreLit>=100 and .motionPixels>=50 and .voicePixels>=50' candidate/ALEC-native-visual-report.json
          test -s candidate/LICENSE
          test -s candidate/ALEC-source.patch
          test -d candidate/new-source
          test -s candidate/new-source/showcase/tauri/sidecar/alec-adaptive-memory.mjs
          test -s candidate/new-source/showcase/tauri/sidecar/alec-proactive.mjs
          (cd candidate && zip -qr ALEC-corresponding-source.zip ALEC-source.patch new-source LICENSE SOURCE.txt BUILD-CANDIDATE.md)
      - name: Publish the single-channel 0.3.2 update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/alec-signed-updater" --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Release already exists; refusing replacement'; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then echo 'Tag already exists; refusing replacement'; exit 1; fi
          cat > notes.md <<'EOF'
          ## ALEC 0.3.2 — Proactive Intelligence
          - Diagnóstico local de CPU, RAM, bateria, espaço livre e cinco processos com maior consumo de RAM.
          - Monitorização opcional, desligada por defeito, a cada minuto quando o ALEC está livre.
          - Aplicação activa: apenas nome do processo; clipboard: apenas alterações e tipo de conteúdo, sem ler o conteúdo.
          - Alertas locais de pressão de CPU/RAM, bateria e clipboard, com limites de frequência e consentimento explícito.
          - Sem chamadas a modelos de IA para diagnóstico; sem encerramento de processos nem reparações automáticas.
          - Personalidade, memória adaptativa, Orb Evolution e actualizador assinado preservados.
          - Testes unitários, diagnóstico real no runner Windows, regressões e compilação concluídos.
          **Limitações:** utilização real e desempenho no computador do utilizador ainda por confirmar. Indicadores podem estar indisponíveis; amostragem pode perder eventos breves. Alertas locais, sem sincronização Remote nesta versão. A memória adaptativa anterior permanece sem cifragem; não guardar segredos. Rollback automático não implementado; assinatura Tauri não equivale a Authenticode.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$EXPECTED_SHA" --title "ALEC 0.3.2" --notes-file notes.md --draft --latest=false \
            candidate/ALEC-Desktop-0.3.2-Preview-x64-setup.exe \
            candidate/ALEC-Desktop-0.3.2-Preview-x64-setup.exe.sig \
            candidate/latest.json candidate/SHA256.txt candidate/LICENSE candidate/ALEC-corresponding-source.zip
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=true
