name: ALEC Publish validated 0.3.4
on:
  push:
    branches: [alec-signed-updater]
    paths: ['.github/workflows/alec-publish-v034.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: alec-publish-v034
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Mula-Edmilson/alec-ola-alec-build'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_SHA: 15e227153e1681b90e8493d209a3f1d3263e72fc
      RUN_ID: '45984883306'
      TAG: v0.3.4
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify publication-only commit and wait for exact signed candidate and validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SHA"
          test "$(git diff --name-only "$EXPECTED_SHA" HEAD)" = ".github/workflows/alec-publish-v034.yml"
          functional="$(gh run view 45980413151 --json status,conclusion,headSha,headBranch,workflowName --repo "$GITHUB_REPOSITORY")"
          jq -e --arg sha "$EXPECTED_SHA" '.status=="completed" and .conclusion=="success" and .headSha==$sha and .headBranch=="alec-browser-developer" and .workflowName=="ALEC Browser Developer functional validation"' <<<"$functional"
          # This publication-only commit also triggers signed updater validation. Require its success:
          # the prior validation may be cancelled by its own concurrency policy.
          deadline=$((SECONDS+6500))
          while true; do
            build="$(gh run view "$RUN_ID" --json status,conclusion,headSha,headBranch,workflowName --repo "$GITHUB_REPOSITORY")"
            jq -e --arg sha "$EXPECTED_SHA" '.headSha==$sha and .headBranch=="alec-signed-updater" and .workflowName=="ALEC Desktop Windows candidate"' <<<"$build"
            if jq -e '.status=="completed"' <<<"$build" >/dev/null; then
              jq -e '.conclusion=="success"' <<<"$build"
              break
            fi
            test "$SECONDS" -lt "$deadline"
            sleep 20
          done
          while true; do
            validation="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&branch=alec-signed-updater&per_page=100" | jq -c '[.workflow_runs[] | select(.name=="ALEC Signed Updater validation")] | sort_by(.id) | last // {}')"
            if jq -e '.status=="completed"' <<<"$validation" >/dev/null; then
              jq -e --arg sha "$GITHUB_SHA" '.conclusion=="success" and .head_sha==$sha and .head_branch=="alec-signed-updater"' <<<"$validation"
              break
            fi
            test "$SECONDS" -lt "$deadline"
            sleep 20
          done
      - name: Verify exact signed package and mandatory runtime navigation report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" | jq -e --arg sha "$EXPECTED_SHA" '[.artifacts[] | select(.expired==false and .name=="ALEC-Desktop-Preview-Windows-x64-candidate" and .workflow_run.head_sha==$sha)] | length==1'
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ALEC-Desktop-Preview-Windows-x64-candidate --dir candidate
          test "$(node -p "require('./desktop-redesign/native/alec-version.json').version")" = "${TAG#v}"
          node desktop-redesign/native/verify-alec-release.mjs candidate
          jq -e --arg version "${TAG#v}" '.version==$version' candidate/latest.json
          test "$(tail -n 1 candidate/SOURCE.txt | tr -d '\r')" = "$EXPECTED_SHA"
          jq -e '.navigationVerified==true and .revision=="ALEC_ORB_EVOLUTION_V1" and .visible==true and .tabs==8 and .coreLit>=100 and .motionPixels>=50 and .voicePixels>=50' candidate/ALEC-native-visual-report.json
          test -s candidate/LICENSE
          test -s candidate/ALEC-source.patch
          test -d candidate/new-source
          test -s candidate/new-source/showcase/tauri/sidecar/alec-adaptive-memory.mjs
          test -s candidate/new-source/showcase/tauri/sidecar/alec-proactive.mjs
          test -s candidate/new-source/showcase/tauri/sidecar/alec-universal.mjs
          for module in alec-native-agents alec-agent-plans alec-browser-adapter alec-developer-adapter; do test -s "candidate/new-source/showcase/tauri/sidecar/$module.mjs"; done
          test -s candidate/new-source/showcase/tauri/agent-runtime/package-lock.json
          test -s candidate/third-party-licenses/Playwright-LICENSE
          test -s candidate/third-party-licenses/Playwright-Core-LICENSE
          (cd candidate && zip -qr ALEC-corresponding-source.zip ALEC-source.patch new-source LICENSE SOURCE.txt BUILD-CANDIDATE.md third-party-licenses)
      - name: Publish the single-channel 0.3.4 update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/alec-signed-updater" --jq .object.sha)" = "$GITHUB_SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'Release already exists; refusing replacement'; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then echo 'Tag already exists; refusing replacement'; exit 1; fi
          cat > notes.md <<'EOF'
          ## ALEC 0.3.4 — Browser & Developer Agent
          - Browser Agent: navegação HTTPS, leitura, cliques, preenchimento e submissão de formulários em sessão isolada, com revisão local.
          - Developer Agent: leitura e listagem de projectos autorizados, revisão de alterações completas, gravação confirmada e testes Node registados.
          - Painel Skill Hub com sessões temporárias, aprovação por passo, cancelamento e Trust Engine.
          - Importação manual de planos JSON sugeridos pelo modelo seleccionado; sem modelo adicional obrigatório.
          - Playwright 1.65.1 incluído, reutilizando Microsoft Edge sem descarregar outro navegador.
          - Testes funcionais, regressões, compilação e instalação Windows aprovados; pacote assinado verificado quanto à consistência do manifesto e SHA-256.
          **Limitações:** JavaScript de páginas e redireccionamentos desactivados; sem sessões de login herdadas. Planos importados e aprovados manualmente; sem execução autónoma. Testes executam código de projectos de confiança com as permissões locais, não numa sandbox de sistema operativo. A memória anterior permanece sem cifragem. A assinatura Tauri não equivale a Authenticode; rollback automático não implementado. Desempenho e credenciais reais do utilizador ainda por confirmar.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$EXPECTED_SHA" --title "ALEC 0.3.4" --notes-file notes.md --draft --latest=false \
            candidate/ALEC-Desktop-0.3.4-Preview-x64-setup.exe \
            candidate/ALEC-Desktop-0.3.4-Preview-x64-setup.exe.sig \
            candidate/latest.json candidate/SHA256.txt candidate/LICENSE candidate/ALEC-corresponding-source.zip
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=true
