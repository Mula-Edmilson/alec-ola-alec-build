name: ALEC Desktop Windows candidate
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [alec-desktop-redesign, alec-proactive-v7, alec-qr-v7.1, alec-qr-v7.2, alec-vision-v8, alec-signed-updater, alec-browser-developer, alec-panel-polish, alec-conversation-engine]
    paths:
      - '.github/workflows/alec-desktop-windows.yml'
      - 'desktop-redesign/native/**'
permissions:
  contents: read
concurrency:
  group: alec-desktop-windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    needs: visual-review
    if: ${{ always() && ((github.ref_name == 'alec-panel-polish' && needs.visual-review.result == 'success') || (github.ref_name != 'alec-panel-polish' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'alec-desktop-redesign' || github.head_ref == 'alec-proactive-v7' || github.head_ref == 'alec-qr-v7.1'))))) }}
    runs-on: windows-latest
    timeout-minutes: 90
    environment: ${{ github.event_name == 'push' && github.ref_name == 'alec-signed-updater' && 'alec-signing' || 'alec-candidate' }}
    env:
      ALEC_UPDATER_PUBLIC_KEY: ${{ github.event_name == 'push' && github.ref_name == 'alec-signed-updater' && vars.ALEC_UPDATER_PUBLIC_KEY || '' }}
    steps:
      - name: Require ALEC signing configuration before building
        if: github.event_name == 'push' && github.ref_name == 'alec-signed-updater'
        shell: bash
        env:
          ALEC_HAS_PRIVATE_KEY: ${{ secrets.ALEC_UPDATER_PRIVATE_KEY != '' }}
          ALEC_HAS_PASSWORD: ${{ secrets.ALEC_UPDATER_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          if [ -z "$ALEC_UPDATER_PUBLIC_KEY" ]; then echo 'Missing Actions variable ALEC_UPDATER_PUBLIC_KEY'; exit 1; fi
          if [ "$ALEC_HAS_PRIVATE_KEY" != "true" ]; then echo 'Missing ALEC_UPDATER_PRIVATE_KEY'; exit 1; fi
          if [ "$ALEC_HAS_PASSWORD" != "true" ]; then echo 'Missing ALEC_UPDATER_PRIVATE_KEY_PASSWORD'; exit 1; fi
          echo 'Signing configuration present (values not displayed).'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Checkout exact Roamies source
        shell: bash
        run: |
          git clone --branch v0.1.51 --depth 1 https://github.com/KenKaiii/Roamies.git upstream
          test "$(git -C upstream rev-parse HEAD)" = "362645466349f4c520ad453d94a94c2481776c2f"
      - name: Transform native source without personal data
        shell: bash
        run: |
          node desktop-redesign/native/preparar-fonte.mjs upstream --public
          node desktop-redesign/native/verificar-paridade.mjs upstream
          node --test desktop-redesign/native/test-alec-orb-evolution.mjs desktop-redesign/native/test-alec-adaptive-memory.mjs desktop-redesign/native/test-alec-proactive.mjs desktop-redesign/native/test-alec-universal.mjs desktop-redesign/native/test-alec-agent-plans.mjs desktop-redesign/native/test-alec-developer-adapter.mjs desktop-redesign/native/test-alec-native-agents.mjs
          node --test desktop-redesign/native/test-alec-conversation.mjs
          node desktop-redesign/native/testar-tailnet.mjs
          node desktop-redesign/native/testar-voz-alec.mjs
          node desktop-redesign/native/testar-contexto-local.mjs
          node desktop-redesign/native/testar-qr.mjs
          if [ "$GITHUB_REF_NAME" = "alec-signed-updater" ]; then node --test desktop-redesign/native/test-alec-update.mjs desktop-redesign/native/test-alec-trust.mjs desktop-redesign/native/test-alec-learn.mjs desktop-redesign/native/test-alec-cloud-evolution.mjs; fi
          if [ "$GITHUB_REF_NAME" = "alec-vision-v8" ]; then node --test desktop-redesign/native/test-alec-sigma-vision.mjs desktop-redesign/native/test-alec-sigma-supervisor.mjs; fi
      - name: Verify compact panel geometry and capture real Edge screenshots
        if: github.ref_name != 'alec-panel-polish'
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          mkdir -p desktop-redesign/native/.visual-runtime
          cp desktop-redesign/native/agent-runtime-package.json desktop-redesign/native/.visual-runtime/package.json
          npm install --prefix desktop-redesign/native/.visual-runtime --omit=dev --ignore-scripts --no-audit --no-fund
          node desktop-redesign/native/testar-layout-painel.mjs upstream/showcase visual-evidence
      - name: Upload panel layout report and screenshots even on failure
        if: always() && github.ref_name != 'alec-panel-polish'
        uses: actions/upload-artifact@v4
        with:
          name: ALEC-panel-layout-evidence
          path: visual-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Install locked sidecar dependencies
        working-directory: upstream/showcase/tauri/sidecar
        shell: bash
        run: npm ci
      - name: Run every sidecar regression test and report all failures
        shell: bash
        run: node desktop-redesign/native/executar-testes.mjs upstream/showcase/tauri/sidecar/test
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Parse transformed native Rust before expensive compilation
        shell: bash
        run: |
          rustfmt --edition 2021 --emit stdout --config skip_children=true upstream/showcase/tauri/src-tauri/src/main.rs > /dev/null
          rustfmt --edition 2021 --emit stdout --config skip_children=true upstream/showcase/tauri/src-tauri/src/voice.rs > /dev/null
      - name: Test original and configurable native wake matcher
        shell: bash
        run: |
          rustc --edition=2021 --test upstream/showcase/tauri/src-tauri/voice-win/src/wake.rs -o wake-tests.exe
          ./wake-tests.exe
          rustc --edition=2021 --test upstream/showcase/tauri/src-tauri/voice-win/src/alec_conversation.rs -o conversation-tests.exe
          ./conversation-tests.exe
          rustfmt --edition 2021 --emit stdout --config skip_children=true upstream/showcase/tauri/src-tauri/voice-win/src/main.rs > /dev/null
          node upstream/showcase/tauri/sidecar/test/alec-wake-phrase.test.mjs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            upstream/showcase/tauri/src-tauri -> target
            upstream/showcase/tauri/src-tauri/voice-win -> target
            upstream/showcase/tauri/src-tauri/hands-win -> target
          key: alec-windows-v7-icon
      - name: Native Windows voice session regression tests
        if: github.ref_name == 'alec-conversation-engine'
        shell: bash
        run: cargo test --locked --manifest-path upstream/showcase/tauri/src-tauri/voice-win/Cargo.toml --bin roamies-voice
      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked
      - name: Package pinned Playwright libraries without browser downloads
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          mkdir -p upstream/showcase/tauri/agent-runtime
          cp desktop-redesign/native/agent-runtime-package.json upstream/showcase/tauri/agent-runtime/package.json
          npm install --prefix upstream/showcase/tauri/agent-runtime --omit=dev --ignore-scripts --no-audit --no-fund
          node -e "for(const n of ['playwright','playwright-core'])if(require('./upstream/showcase/tauri/agent-runtime/node_modules/'+n+'/package.json').version!=='1.65.1')process.exit(1)"
      - name: Compile Windows x64 NSIS installer
        working-directory: upstream/showcase/tauri
        shell: bash
        env:
          TAURI_BUNDLES: nsis
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && github.ref_name == 'alec-signed-updater' && secrets.ALEC_UPDATER_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref_name == 'alec-signed-updater' && secrets.ALEC_UPDATER_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [ -n "$ALEC_UPDATER_PUBLIC_KEY" ]; then
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then echo 'Protected signing environment not provisioned'; exit 1; fi
          else
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          ./build.sh release --target x86_64-pc-windows-msvc
      - name: Install and verify native helpers and runtime
        working-directory: upstream/showcase/tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No installer produced' }
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode) { throw "Installer failed ($($p.ExitCode))" }
          $app = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'ALEC'), (Join-Path $env:ProgramFiles 'ALEC') -Filter roamies.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'Installed ALEC binary not found' }
          $dir = $app.DirectoryName
          # Inspect the actual installed EXE's icon (not just the source ICO).
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($app.FullName)
          if (-not $icon) { throw 'Installed executable icon is absent' }
          $bitmap = $icon.ToBitmap()
          $scaled = [System.Drawing.Bitmap]::new($bitmap,32,32)
          $white = 0; $navy = 0
          for ($y=0; $y -lt 32; $y++) {
            for ($x=0; $x -lt 32; $x++) {
              $c = $scaled.GetPixel($x,$y)
              if ($c.A -gt 200 -and $c.R -gt 210 -and $c.G -gt 210 -and $c.B -gt 210) { $white++ }
              if ($c.A -gt 200 -and $c.R -lt 45 -and $c.G -lt 45 -and $c.B -lt 75) { $navy++ }
            }
          }
          $scaled.Dispose(); $bitmap.Dispose(); $icon.Dispose()
          Write-Host "Installed executable icon: white=$white navy=$navy"
          if ($white -lt 80 -or $navy -lt 200) { throw 'Installed executable did not expose the official white/navy ALEC icon' }
          $missing = @('roamies-node.exe','roamies-voice.exe','roamies-hands.exe','sidecar/sidekick.mjs','msvcp140.dll','msvcp140_1.dll','vcruntime140.dll','vcruntime140_1.dll','onnxruntime.dll') | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) { throw "Missing native files: $($missing -join ', ')" }
          & (Join-Path $dir 'roamies-hands.exe') --self-test
          if ($LASTEXITCODE) { throw 'Hands self-test failed' }
          & (Join-Path $dir 'roamies-voice.exe') --test-ort
          if ($LASTEXITCODE) { throw 'Voice ONNX runtime failed' }
          $perms = & (Join-Path $dir 'roamies-voice.exe') --perms
          if (-not ($perms -match '"type":"perms"')) { throw 'Voice helper failed to start' }
          & (Join-Path $dir 'roamies-node.exe') --check (Join-Path $dir 'sidecar/sidekick.mjs')
          if ($LASTEXITCODE) { throw 'Bundled sidecar syntax failed' }
          & (Join-Path $dir 'roamies-node.exe') (Join-Path $env:GITHUB_WORKSPACE 'desktop-redesign/native/testar-agentes-instalados.mjs') $dir
          if ($LASTEXITCODE) { throw 'Bundled agent runtime or Edge sandbox smoke test failed' }
          $data = Join-Path $env:RUNNER_TEMP 'alec-smoke'
          $configDir = Join-Path $data 'Roamies/Data'
          New-Item -ItemType Directory -Force $configDir | Out-Null
          Set-Content (Join-Path $configDir 'settings.json') '{"onboarded":true,"setupVersion":2,"voice":false,"alecRemoteEnabled":false,"seenVersion":"0.1.51"}' -Encoding utf8NoBOM
          $env:ROAMIES_DATA_DIR = $data
          # Test runner only: inspect the actual installed WebView2. Never embedded in the release.
          $env:ALEC_UI_TEST = '1'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1'
          $run = Start-Process -FilePath $app.FullName -ArgumentList '--panel' -PassThru
          try {
            $logs = Join-Path $data 'Roamies/Data/logs'
            $started = $false
            for ($i=0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              if ($run.HasExited) { break }
              if (Get-ChildItem $logs -Filter *.log -ErrorAction SilentlyContinue | Select-String -Pattern ' start ' -Quiet) { $started=$true; break }
            }
            if (-not ($started -and -not $run.HasExited)) { throw 'Installed sidecar did not start' }
            $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
            $expectedStartup = '"' + $app.FullName + '"'
            $startup = $null
            for ($i=0; $i -lt 20; $i++) {
              $startup = Get-ItemPropertyValue -Path $runKey -Name ALEC -ErrorAction SilentlyContinue
              if ($startup -eq $expectedStartup) { break }
              Start-Sleep -Seconds 1
            }
            if ($startup -ne $expectedStartup) { throw 'ALEC independent autostart was not registered to the installed EXE' }
            Write-Host 'ALEC independent autostart verified against installed executable.'
            if ($env:GITHUB_REF_NAME -eq 'alec-signed-updater') {
              $intro = $false
              for ($i=0; $i -lt 45; $i++) {
                if ($run.HasExited) { break }
                if (Get-ChildItem $logs -Filter *.log -ErrorAction SilentlyContinue | Select-String -Pattern 'alec_intro_visible' -Quiet) { $intro=$true; break }
                Start-Sleep -Seconds 1
              }
              if (-not $intro) { throw 'Installed ALEC overlay did not acknowledge its startup appearance' }
              Write-Host 'ALEC startup Orb appearance acknowledged by the installed overlay.'
            }
            Start-Process -FilePath $app.FullName -ArgumentList '--panel'
            $reportPath = Join-Path $data 'alec-native-visual-report.json'
            for ($i=0; $i -lt 100; $i++) {
              if (Test-Path $reportPath) { break }
              if ($run.HasExited) { break }
              if ($i -eq 30 -or $i -eq 60) { Start-Process -FilePath $app.FullName -ArgumentList '--panel' }
              Start-Sleep -Seconds 1
            }
            if (-not (Test-Path $reportPath)) {
              Write-Host '--- Native window trace ---'
              Get-Content (Join-Path $data 'alec-native-window.log') -ErrorAction SilentlyContinue
              Write-Host '--- Native sidecar trace ---'
              Get-ChildItem $logs -Filter *.log -ErrorAction SilentlyContinue | Get-Content -Tail 25
              Get-Content (Join-Path $env:USERPROFILE 'Roamies/Data/logs/sidekick.log') -Tail 35 -ErrorAction SilentlyContinue
              Get-Process -Name roamies,msedgewebview2 -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,SessionId,MainWindowTitle | Format-Table -AutoSize
              throw 'Installed native dashboard did not report a visible orb and all eight navigation entries'
            }
            $report = Get-Content $reportPath -Raw | ConvertFrom-Json
            if ($report.revision -ne 'ALEC_ORB_EVOLUTION_V1' -or $report.lit -le 100 -or $report.blue -le 50 -or $report.coreLit -lt 100 -or $report.motionPixels -lt 50 -or $report.voicePixels -lt 50 -or -not $report.visible -or -not $report.compose -or -not $report.noHomeInput -or -not $report.listen -or $report.tabs -ne 8 -or $report.windowWidth -gt 400 -or $report.windowHeight -gt 490) { throw 'Installed dashboard failed required runtime visual assertions' }
            $visualOut = Join-Path $env:GITHUB_WORKSPACE 'candidate'
            New-Item -ItemType Directory -Force $visualOut | Out-Null
            Copy-Item $reportPath (Join-Path $visualOut 'ALEC-native-visual-report.json')
            Get-Content $reportPath
            # The embedded native WebView report is mandatory. CDP capture remains a separate evidence check.
            & node (Join-Path $env:GITHUB_WORKSPACE 'desktop-redesign/native/verificar-visual-instalado.mjs') (Join-Path $visualOut 'ALEC-installed-dashboard.png')
            if ($LASTEXITCODE) {
              Write-Warning 'Installed canvas passed native validation, but screenshot capture via CDP was unavailable.'
              Set-Content (Join-Path $visualOut 'SCREENSHOT-UNAVAILABLE.txt') 'Actual native dashboard pixel and controls validation passed. CDP screenshot unavailable; visual fidelity requires interactive review.'
            }
          } finally {
            if (-not $run.HasExited) { taskkill /PID $run.Id /T /F | Out-Null }
          }
          $out = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          New-Item -ItemType Directory -Force $out | Out-Null
          $version = (Get-Content (Join-Path $env:GITHUB_WORKSPACE 'desktop-redesign/native/alec-version.json') -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid ALEC version' }
          $dest = Join-Path $out "ALEC-Desktop-$version-Preview-x64-setup.exe"
          Copy-Item $setup.FullName $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content (Join-Path $out 'SHA256.txt') "$hash  $(Split-Path $dest -Leaf)" -Encoding utf8NoBOM
          if ($env:ALEC_UPDATER_PUBLIC_KEY) {
            $sig = $setup.FullName + '.sig'
            if (-not (Test-Path $sig)) { throw 'Signed build missing detached signature' }
            Copy-Item $sig ($dest + '.sig')
            $version = (Get-Content (Join-Path $env:GITHUB_WORKSPACE 'desktop-redesign/native/alec-version.json') -Raw | ConvertFrom-Json).version
            $manifest = @{ version=$version; notes='ALEC Preview'; pub_date=(Get-Date).ToUniversalTime().ToString('o'); platforms=@{'windows-x86_64'=@{signature=(Get-Content $sig -Raw).Trim();url=('https://github.com/Mula-Edmilson/alec-ola-alec-build/releases/download/v'+$version+'/'+(Split-Path $dest -Leaf))}} }
            $manifest | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $out 'latest.json') -Encoding utf8NoBOM
          }
      - name: Validate signed release package before upload
        if: env.ALEC_UPDATER_PUBLIC_KEY != ''
        shell: bash
        run: node desktop-redesign/native/verify-alec-release.mjs candidate
      - name: Include corresponding source and license
        shell: bash
        run: |
          git -C upstream diff --binary HEAD > candidate/ALEC-source.patch
          mkdir -p candidate/new-source
          git -C upstream ls-files --others --exclude-standard -- showcase/tauri/sidecar/alec-qr-runtime.mjs showcase/tauri/sidecar/alec-qrcode.cjs showcase/tauri/sidecar/alec-local-context.mjs showcase/tauri/sidecar/alec-voice-preference.mjs showcase/tauri/sidecar/alec-legacy-profile.mjs showcase/tauri/sidecar/alec-skill-hub.mjs showcase/tauri/sidecar/alec-bridge-supervisor.mjs showcase/panel/alec-theme.css showcase/tauri/sidecar/alec-wake-phrase.mjs showcase/tauri/sidecar/test/alec-wake-phrase.test.mjs showcase/tauri/sidecar/alec-sigma-vision.mjs showcase/tauri/sidecar/alec-sigma-supervisor.mjs showcase/tauri/sidecar/alec-update.mjs showcase/tauri/sidecar/alec-trust.mjs showcase/tauri/sidecar/alec-learn.mjs showcase/tauri/sidecar/alec-cloud.mjs showcase/tauri/sidecar/alec-cloud-local.mjs showcase/tauri/sidecar/alec-evolution.mjs showcase/tauri/sidecar/alec-adaptive-memory.mjs showcase/tauri/sidecar/alec-proactive.mjs showcase/tauri/sidecar/alec-universal.mjs showcase/tauri/sidecar/alec-agent-plans.mjs showcase/tauri/sidecar/alec-browser-adapter.mjs showcase/tauri/sidecar/alec-developer-adapter.mjs showcase/tauri/sidecar/alec-native-agents.mjs | while IFS= read -r f; do
            mkdir -p "candidate/new-source/$(dirname "$f")"
            cp "upstream/$f" "candidate/new-source/$f"
          done
          mkdir -p candidate/new-source/showcase/tauri/agent-runtime
          cp upstream/showcase/tauri/agent-runtime/package.json upstream/showcase/tauri/agent-runtime/package-lock.json candidate/new-source/showcase/tauri/agent-runtime/
          mkdir -p candidate/third-party-licenses
          cp upstream/showcase/tauri/agent-runtime/node_modules/playwright/LICENSE candidate/third-party-licenses/Playwright-LICENSE
          cp upstream/showcase/tauri/agent-runtime/node_modules/playwright-core/LICENSE candidate/third-party-licenses/Playwright-Core-LICENSE
          cp upstream/LICENSE candidate/LICENSE
          cp desktop-redesign/native/BUILD-CANDIDATE.md candidate/
          echo 'Upstream: https://github.com/KenKaiii/Roamies/tree/362645466349f4c520ad453d94a94c2481776c2f' > candidate/SOURCE.txt
          git rev-parse HEAD >> candidate/SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ALEC-Desktop-Preview-Windows-x64-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 30

  visual-review:
    if: github.ref_name == 'alec-panel-polish'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Transform exact native source and check parity
        shell: bash
        run: |
          git clone --branch v0.1.51 --depth 1 https://github.com/KenKaiii/Roamies.git upstream
          test "$(git -C upstream rev-parse HEAD)" = "362645466349f4c520ad453d94a94c2481776c2f"
          node desktop-redesign/native/preparar-fonte.mjs upstream --public
          node desktop-redesign/native/verificar-paridade.mjs upstream
          node --check upstream/showcase/panel/panel.js
      - name: Verify panel geometry and capture Edge screenshots
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          mkdir -p desktop-redesign/native/.visual-runtime
          cp desktop-redesign/native/agent-runtime-package.json desktop-redesign/native/.visual-runtime/package.json
          npm install --prefix desktop-redesign/native/.visual-runtime --omit=dev --ignore-scripts --no-audit --no-fund
          node desktop-redesign/native/testar-layout-painel.mjs upstream/showcase visual-evidence
      - name: Upload evidence for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALEC-panel-layout-evidence
          path: visual-evidence/
          if-no-files-found: warn
          retention-days: 30
