name: ALEC Live protocol laboratory
on:
  push:
    branches: [alec-live-engine]
    paths: ['desktop-redesign/live/**', '.github/workflows/alec-live-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - shell: bash
        working-directory: desktop-redesign/live
        run: |
          node --check server.mjs
          node --check client.js
          node --check capture.js
          node --test transport.test.mjs
